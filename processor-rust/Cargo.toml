[package]
name = "processor-rust"
version = "0.1.0"
edition = "2021"
description = "Document text extraction and OCR worker for the True Crime Investigation Platform"

[lib]
name = "processor_rust"
path = "src/lib.rs"

[[bin]]
name = "processor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.39", features = ["serde"] }
lopdf = "0.34.0"
redis = { version = "0.27.6", features = ["tokio-comp", "streams"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json"] }
tempfile = "3.15.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.4"
uuid = { version = "1.12.1", features = ["v4", "serde"] }
