<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b6f47" />
    <title>Offline — Case Files</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fafaf7;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 480px;
        padding: 28px;
        background: #e8e3d5;
        border: 1px solid #c9c1ae;
        border-radius: 4px;
      }
      h1 {
        margin: 0 0 12px;
        font-family: 'Iowan Old Style', 'Charter', Georgia, serif;
        font-size: 1.75rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: #3a3a3a;
      }
      a {
        display: inline-block;
        padding: 10px 16px;
        background: #8b6f47;
        color: #fafaf7;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are currently offline</h1>
      <p>
        Case Files could not reach the archive server. Previously opened dossiers remain available
        from your device cache while offline.
      </p>
      <a href="/">Return to cached cases</a>
    </main>
  </body>
</html>
